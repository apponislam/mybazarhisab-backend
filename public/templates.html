<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bazar Hisab - Email Templates Preview</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <style>
            :root {
                --bg-dark: #1a0e07;
                --bg-sidebar: #251508;
                --border-color: rgba(232, 160, 32, 0.18);
                --primary: #e8a020;
                --primary-hover: #c06010;
                --text-main: #f5ede2;
                --text-muted: #a08060;
                --card-bg: #251508;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Inter", sans-serif;
                background-color: var(--bg-dark);
                color: var(--text-main);
                height: 100vh;
                display: flex;
                overflow: hidden;
            }

            /* Sidebar Styling */
            .sidebar {
                width: 320px;
                background-color: var(--bg-sidebar);
                border-right: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }

            .sidebar-header {
                padding: 24px;
                border-bottom: 1px solid var(--border-color);
            }

            .sidebar-header h1 {
                font-size: 1.25rem;
                font-weight: 700;
                color: var(--text-main);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .sidebar-header h1 span {
                background: linear-gradient(135deg, #e8a020 0%, #c06010 100%);
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .sidebar-header p {
                font-size: 0.85rem;
                color: var(--text-muted);
                margin-top: 4px;
            }

            .template-list {
                list-style: none;
                overflow-y: auto;
                padding: 16px 12px;
                flex-grow: 1;
            }

            .template-item {
                padding: 12px 16px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 0.9rem;
                font-weight: 500;
                color: var(--text-muted);
                margin-bottom: 6px;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .template-item:hover {
                background-color: rgba(232, 160, 32, 0.08);
                color: var(--text-main);
            }

            .template-item.active {
                background-color: var(--primary);
                color: #1a0e07;
                font-weight: 700;
                box-shadow: 0 4px 12px rgba(232, 160, 32, 0.35);
            }

            .template-item .badge {
                font-size: 0.7rem;
                padding: 2px 8px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.15);
            }

            /* Main Preview Container */
            .main-content {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                background-color: #090d16;
                overflow: hidden;
            }

            .topbar {
                height: 64px;
                border-bottom: 1px solid var(--border-color);
                background-color: var(--bg-sidebar);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 24px;
            }

            .topbar .title-group h2 {
                font-size: 1.1rem;
                font-weight: 600;
            }

            .topbar .title-group span {
                font-size: 0.8rem;
                color: var(--text-muted);
            }

            .actions {
                display: flex;
                gap: 12px;
            }

            .btn {
                background: var(--border-color);
                color: var(--text-main);
                border: none;
                padding: 8px 16px;
                border-radius: 6px;
                font-size: 0.85rem;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.2s ease;
            }

            .btn:hover {
                background: #475569;
            }

            .btn-primary {
                background: var(--primary);
            }

            .btn-primary:hover {
                background: var(--primary-hover);
            }

            .preview-area {
                flex-grow: 1;
                padding: 30px;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                overflow-y: auto;
            }

            .viewport-wrapper {
                width: 100%;
                max-width: 700px;
                background: #ffffff;
                border-radius: 12px;
                box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.5),
                    0 8px 10px -6px rgba(0, 0, 0, 0.5);
                padding: 30px;
                min-height: 400px;
                transition: max-width 0.3s ease;
            }

            .device-toggle {
                display: flex;
                background: #0f172a;
                padding: 4px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
            }

            .device-btn {
                padding: 4px 12px;
                border: none;
                background: transparent;
                color: var(--text-muted);
                font-size: 0.8rem;
                border-radius: 6px;
                cursor: pointer;
            }

            .device-btn.active {
                background: var(--primary);
                color: #fff;
            }

            /* HTML View Frame */
            iframe {
                width: 100%;
                height: 550px;
                border: none;
                border-radius: 8px;
                background: #ffffff;
            }
        </style>
    </head>
    <body>
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><span>Bazar Hisab</span> Emails</h1>
                <p>Email Templates Demo Viewer</p>
            </div>
            <ul class="template-list" id="templateList">
                <!-- Items injected by JS -->
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="title-group">
                    <h2 id="activeTemplateTitle">Select a Template</h2>
                    <span id="activeTemplateSubject">Subject will appear here</span>
                </div>
                <div class="actions">
                    <div class="device-toggle">
                        <button class="device-btn active" onclick="setViewport('desktop')">Desktop</button>
                        <button class="device-btn" onclick="setViewport('mobile')">Mobile</button>
                    </div>
                    <button class="btn btn-primary" onclick="copyHTML()">Copy HTML</button>
                </div>
            </header>

            <section class="preview-area">
                <div class="viewport-wrapper" id="viewportWrapper">
                    <iframe id="previewFrame"></iframe>
                </div>
            </section>
        </main>

        <script>
            function renderBaseLayout({ title, bodyHtml, footerText = "This is an automated email from Bazar Hisab. Please do not reply directly." }) {
                const currentYear = new Date().getFullYear();
                return `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; padding: 30px 10px;">
        <tr>
            <td align="center">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04);">
                    <tr>
                        <td style="background-color: #1a0e07; padding: 24px 28px; text-align: center; border-bottom: 3px solid #e8a020;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center">
                                <tr>
                                    <td style="vertical-align: middle;">
                                        <img src="${window.location.origin}/logo.png" alt="Bazar Hisab Logo" width="34" height="34" style="display: block; width: 34px; height: 34px; border-radius: 8px; border: 0; object-fit: contain; background-color: #e8a020;" onerror="this.src='https://mybazarhisab-backend.vercel.app/logo.png'" />
                                    </td>
                                    <td style="padding-left: 10px; font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 1px; vertical-align: middle;">
                                        BAZAR <span style="color: #e8a020;">HISAB</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 32px 28px 24px 28px; color: #334155; font-size: 15px; line-height: 1.6;">
                            ${bodyHtml}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 28px;">
                            <hr style="border: none; border-top: 1px solid #f1f5f9; margin: 0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 28px; background-color: #fafafa; text-align: center; color: #94a3b8; font-size: 12px; line-height: 1.5;">
                            <p style="margin: 0 0 6px 0;">${footerText}</p>
                            <p style="margin: 0; font-weight: 600; color: #64748b;">
                                &copy; ${currentYear} Bazar Hisab Platform. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
            `.trim();
            }

            const templates = [
                {
                    id: "verification",
                    name: "Verify Email",
                    subject: "Verify Your Email Address",
                    badge: "Auth",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Verify Your Email Address",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Appon Islam,</h2>
                        <p style="margin-bottom: 24px; color: #475569;">Thank you for signing up for <strong>Bazar Hisab</strong>. Please verify your email address to start tracking your family and group expenses, utility bills, and daily spending with ease.</p>
                        <div style="text-align: center; margin: 32px 0;">
                            <a href="http://localhost:3000/verify-email?token=sample123&email=apponislam@example.com" target="_blank" style="background-color: #e8a020; color: #1a0e07; font-weight: 700; font-size: 15px; text-decoration: none; padding: 14px 32px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 12px rgba(232, 160, 32, 0.3);">
                                Verify Email Address
                            </a>
                        </div>
                        <div style="background-color: #fffbeb; border: 1px dashed #fcd34d; border-radius: 10px; padding: 20px; text-align: center; margin: 28px 0;">
                            <p style="margin: 0 0 8px 0; color: #92400e; font-size: 13px; font-weight: 600; text-transform: uppercase;">Or Enter 6-Digit Code In App</p>
                            <div style="font-size: 32px; font-weight: 800; color: #78350f; letter-spacing: 6px;">849201</div>
                            <p style="margin: 8px 0 0 0; color: #b45309; font-size: 12px;">This code expires in 10 minutes.</p>
                        </div>
                        <p style="margin-top: 24px; font-size: 13px; color: #64748b;">
                            If the button doesn't work, copy and paste this link into your browser:<br>
                            <a href="http://localhost:3000/verify-email?token=sample123&email=apponislam@example.com" style="color: #d97706;">http://localhost:3000/verify-email?token=sample123&email=apponislam@example.com</a>
                        </p>
                    `,
                        }),
                },
                {
                    id: "otp",
                    name: "OTP Code",
                    subject: "Your One-Time Password (OTP)",
                    badge: "Auth",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Your One-Time Password (OTP)",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Appon,</h2>
                        <p style="margin-bottom: 20px; color: #475569;">Use the 6-digit OTP code below to complete your authentication or request in <strong>Bazar Hisab</strong>:</p>
                        <div style="background-color: #1a0e07; border-radius: 12px; padding: 24px; text-align: center; margin: 28px 0;">
                            <div style="font-size: 36px; font-weight: 800; color: #e8a020; letter-spacing: 8px; font-family: monospace;">592014</div>
                            <p style="margin: 10px 0 0 0; color: #a08060; font-size: 12px;">Valid for the next 10 minutes</p>
                        </div>
                        <p style="font-size: 13px; color: #64748b; margin: 0;">
                            If you did not request this code, please ignore this email or contact support if you suspect unauthorized activity.
                        </p>
                    `,
                        }),
                },
                {
                    id: "welcome",
                    name: "Welcome Email",
                    subject: "Welcome to Bazar Hisab!",
                    badge: "Onboarding",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Welcome to Bazar Hisab!",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Welcome, Appon Islam! 🎉</h2>
                        <p style="margin-bottom: 16px; color: #475569;">We're thrilled to have you join <strong>Bazar Hisab</strong> — your smart assistant for managing family & mess budgets, daily bazar expenses, utility bills, and monthly spending with ease.</p>
                        <div style="background-color: #f8fafc; border-left: 4px solid #e8a020; padding: 16px 20px; border-radius: 6px; margin: 24px 0;">
                            <h4 style="margin: 0 0 8px 0; color: #1a0e07; font-size: 15px; font-weight: 700;">What you can do now:</h4>
                            <ul style="margin: 0; padding-left: 20px; color: #475569; font-size: 14px; line-height: 1.6;">
                                <li>Create or join a Group with your family or flatmates</li>
                                <li>Add daily bazar expenses, grocery items & utility bills</li>
                                <li>Calculate total monthly spending & track individual member balances</li>
                            </ul>
                        </div>
                        <p style="margin-top: 20px; color: #475569;">If you ever need help or have questions, reach out to our team anytime.</p>
                    `,
                        }),
                },
                {
                    id: "email_update",
                    name: "Email Update Verification",
                    subject: "Verify Your New Email Address",
                    badge: "Account",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Verify Your New Email Address",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Appon Islam,</h2>
                        <p style="margin-bottom: 24px; color: #475569;">You recently requested to update your registered email address on <strong>Bazar Hisab</strong>. Please confirm this change by clicking below:</p>
                        <div style="text-align: center; margin: 32px 0;">
                            <a href="http://localhost:3000/verify-new-email?token=newemail123&email=appon.new@example.com" target="_blank" style="background-color: #e8a020; color: #1a0e07; font-weight: 700; font-size: 15px; text-decoration: none; padding: 14px 32px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 12px rgba(232, 160, 32, 0.3);">
                                Confirm New Email
                            </a>
                        </div>
                        <p style="font-size: 13px; color: #64748b;">
                            If you did not request an email update, please change your password immediately or contact our support team.
                        </p>
                    `,
                        }),
                },
                {
                    id: "password_reset",
                    name: "Password Reset",
                    subject: "Reset Your Password",
                    badge: "Security",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Reset Your Password",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Appon Islam,</h2>
                        <p style="margin-bottom: 20px; color: #475569;">We received a request to reset your password for your <strong>Bazar Hisab</strong> account. Use the 6-digit OTP code below in the app to set a new password:</p>
                        <div style="background-color: #1a0e07; border-radius: 12px; padding: 24px; text-align: center; margin: 28px 0;">
                            <p style="margin: 0 0 8px 0; color: #a08060; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Password Reset OTP Code</p>
                            <div style="font-size: 36px; font-weight: 800; color: #e8a020; letter-spacing: 8px; font-family: monospace;">918234</div>
                            <p style="margin: 10px 0 0 0; color: #a08060; font-size: 12px;">Valid for the next 10 minutes</p>
                        </div>
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 20px;">This code expires in 10 minutes. If you didn't request a password reset, please ignore this email or contact support.</p>
                    `,
                        }),
                },
                {
                    id: "group_invite",
                    name: "Group Invitation",
                    subject: 'Invitation to join "Uttara Green Mess" on Bazar Hisab',
                    badge: "Group",
                    getHtml: () =>
                        renderBaseLayout({
                            title: 'Invitation to join "Uttara Green Mess"',
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Tanvir,</h2>
                        <p style="margin-bottom: 20px; color: #475569;"><strong>Appon Islam</strong> has invited you to join the mess/group <strong>"Uttara Green Mess"</strong> on Bazar Hisab.</p>
                        <div style="text-align: center; margin: 32px 0;">
                            <a href="http://localhost:3000/join-group?code=ABC123" target="_blank" style="background-color: #e8a020; color: #1a0e07; font-weight: 700; font-size: 15px; text-decoration: none; padding: 14px 32px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 12px rgba(232, 160, 32, 0.3);">
                                Accept Invitation
                            </a>
                        </div>
                        <p style="font-size: 13px; color: #64748b;">
                            By joining, you will be able to submit daily expenses, track utility bills, and view real-time monthly spending reports.
                        </p>
                    `,
                        }),
                },
                {
                    id: "contact_reply",
                    name: "Contact Support Reply",
                    subject: "Re: Issue with monthly expense calculations",
                    badge: "Support",
                    getHtml: () =>
                        renderBaseLayout({
                            title: "Re: Issue with monthly expense calculations",
                            bodyHtml: `
                        <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 12px; font-size: 20px; font-weight: 700;">Hello Tanvir Hasan,</h2>
                        <p style="margin-bottom: 16px; color: #475569;">Thank you for contacting <strong>Bazar Hisab Support</strong> regarding: <strong>"Issue with monthly expense calculations"</strong>.</p>
                        <div style="background-color: #f8fafc; border-left: 3px solid #cbd5e1; padding: 12px 16px; margin: 16px 0; color: #64748b; font-style: italic; font-size: 14px;">
                            "Hi, I noticed that my total expenses for August were missing utility bill items. Could you check?"
                        </div>
                        <div style="background-color: #f0fdf4; border-left: 4px solid #22c55e; border-radius: 8px; padding: 20px; margin: 24px 0;">
                            <h4 style="margin: 0 0 10px 0; color: #166534; font-weight: 700; font-size: 15px;">Support Team Response:</h4>
                            <div style="color: #1e293b; font-size: 15px; line-height: 1.6;">
                                Hello Tanvir,<br/><br/>We have reviewed your account details and updated the daily calculation matrix. Utility bills are now correctly synchronized into your total monthly breakdown. Thank you for bringing this to our attention!
                            </div>
                        </div>
                    `,
                        }),
                },
            ];

            let activeIndex = 0;

            function renderSidebar() {
                const listEl = document.getElementById("templateList");
                listEl.innerHTML = templates
                    .map(
                        (tmpl, idx) => `
                <li class="template-item ${idx === activeIndex ? "active" : ""}" onclick="selectTemplate(${idx})">
                    <span>${tmpl.name}</span>
                    <span class="badge">${tmpl.badge}</span>
                </li>
            `,
                    )
                    .join("");
            }

            function selectTemplate(index) {
                activeIndex = index;
                renderSidebar();
                const tmpl = templates[index];
                document.getElementById("activeTemplateTitle").innerText = tmpl.name;
                document.getElementById("activeTemplateSubject").innerText = `Subject: ${tmpl.subject}`;

                const frame = document.getElementById("previewFrame");
                const doc = frame.contentDocument || frame.contentWindow.document;
                doc.open();
                doc.write(tmpl.getHtml());
                doc.close();
            }

            function setViewport(type) {
                const wrapper = document.getElementById("viewportWrapper");
                const btns = document.querySelectorAll(".device-btn");
                btns.forEach((b) => b.classList.remove("active"));
                if (type === "mobile") {
                    wrapper.style.maxWidth = "420px";
                    btns[1].classList.add("active");
                } else {
                    wrapper.style.maxWidth = "700px";
                    btns[0].classList.add("active");
                }
            }

            function copyHTML() {
                const html = templates[activeIndex].getHtml();
                navigator.clipboard.writeText(html);
                alert("Email HTML copied to clipboard!");
            }

            // Initial setup
            renderSidebar();
            selectTemplate(0);
        </script>
    </body>
</html>
